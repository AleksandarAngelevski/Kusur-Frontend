<div class="authCard">
    <div class="header">
        <span class="logo">
            <svg class="logoImage" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
                <circle cx="9" cy="12" r="6"/>
                <circle cx="15" cy="12" r="6"/>
            </svg>
            kusur
        </span>
        <div class="motto">
            <span>split bills, keep friends</span>
        </div>
    </div>
    <div class="tear"></div>
    <div class="main">
        <div class="mainContentHeader">
            <h1>Welcome back</h1>
            <p>Sign in to see where things stand.</p>
        </div>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="form-group" [class.invalid]="emailError()">
                <label for="email">Email</label>
                <input id="email" type="email" formControlName="email" autocomplete="email"
                    [attr.aria-invalid]="emailError() ? 'true' : null"
                    [attr.aria-describedby]="emailError() ? 'email-error' : null" />
            </div>
            @if (emailError()) {
                <p class="field-error" id="email-error">{{ emailError() }}</p>
            }
            <div class="form-group" [class.invalid]="passwordError()">
                <label for="password">Password</label>
                <input id="password" type="password" formControlName="password" autocomplete="current-password"
                    [attr.aria-invalid]="passwordError() ? 'true' : null"
                    [attr.aria-describedby]="passwordError() ? 'password-error' : null" />
            </div>
            @if (passwordError()) {
                <p class="field-error" id="password-error">{{ passwordError() }}</p>
            }
            <a class="forgot" href="#">Forgot password?</a>
            @if (errorMessage()) {
                <p class="error" role="alert">{{ errorMessage() }}</p>
            }
            <button type="submit" [disabled]="submitting()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M9 6l6 6-6 6"/>
                </svg>
                {{ submitting() ? 'Signing in…' : 'Sign in' }}
            </button>
        </form>
        <p class="footer">New to kusur? <a routerLink="/register">Create an account</a></p>
    </div>
</div>
