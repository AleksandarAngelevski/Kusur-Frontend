<h2 class="section-title">Profile</h2>
<div class="register">
    <div class="row">
        <div class="mainContent">
            <div class="desc">Signed in as</div>
            <div class="title">{{ username() }}</div>
        </div>
    </div>
    @if (user(); as user) {
        <div class="row">
            <div class="mainContent">
                <div class="desc">Email</div>
                <div class="title">{{ user.email }}</div>
            </div>
        </div>
        <div class="row">
            <div class="mainContent">
                <div class="desc">Role</div>
                <div class="title">{{ user.role === 'ADMIN' ? 'Admin' : 'Member' }}</div>
            </div>
        </div>
    }
</div>
