<div class="shell-content receipt">
    @if (groups.loadError()) {
        <div class="load-error" role="alert">
            <span>{{ groups.loadError() }}</span>
            <button type="button" (click)="retry()">Try again</button>
        </div>
    }
    <router-outlet></router-outlet>
</div>
