<div class="heading">
    <h2 id="header" class="section-title">Groups</h2>
    <a class="new-group" routerLink="/groups/new">+ New group</a>
</div>
<div class="groups-container register">
    @for (group of groups(); track group.id){
        <app-group-card [group]="group"/>
    } @empty {
        <p class="empty">No groups yet.</p>
    }
</div>

<div class="heading">
    <h2 class="section-title">Friends</h2>
    <a class="new-group" routerLink="/friends/new">+ Add friend</a>
</div>
<div class="friends-container register">
    @for (friend of friends(); track friend.id){
        <app-group-card [group]="friend" [friend]="true"/>
    } @empty {
        <p class="empty">Add a friend to split an expense with just them, no group needed.</p>
    }
</div>
