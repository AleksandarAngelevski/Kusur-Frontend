<div class="netcard">
    <div class="label">Your net balance</div>
    <div class="big"
         [class.credit]="netBalance() > 0"
         [class.debit]="netBalance() < 0">
        {{ netBalance() > 0 ? '+' : '' }}{{ netBalance() | number:'1.0-0':'de-DE' }} ден
    </div>
    <div class="lines">
        <div class="line">
            <span>You're owed</span>
            <span class="money" [class.credit]="owedBalance() !== 0">{{ owedBalance() | number:'1.0-0':'de-DE' }} ден</span>
        </div>
        <div class="line">
            <span>You owe</span>
            <span class="money" [class.debit]="oweBalance() !== 0">{{ oweBalance() | number:'1.0-0':'de-DE' }} ден</span>
        </div>
    </div>
</div>
