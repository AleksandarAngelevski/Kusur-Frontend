server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The API is served from the same origin as the pages, like the dev server's proxy does.
    # That keeps the refresh cookie (SameSite=Strict, Path=/api/auth) working and needs no CORS.
    location /api/ {
        proxy_pass http://backend:8080;
        # the original host and port, so the backend sees these as same-origin requests
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular handles its own routes: anything that is not a file gets the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
