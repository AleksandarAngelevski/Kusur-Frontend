name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # the Angular app lives one folder down from the repository root
        working-directory: kusur-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: kusur-frontend/package-lock.json

      - run: npm ci

      - name: Unit tests
        run: npx ng test --watch=false

      - name: Production build
        run: npx ng build
